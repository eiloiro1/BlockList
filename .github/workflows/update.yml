name: Atualizar Vitta Social Blocklist

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar lista
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Commit se houver alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add block/social-vitta.txt

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao."
            exit 0
          fi

          git commit -m "Atualiza block/social-vitta.txt"
          git push
